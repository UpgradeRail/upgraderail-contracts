[workspace]
resolver = "2"
members = [
    "contracts/upgrade-controller",
    "fixtures/fleet-v1",
    "fixtures/fleet-v2-compatible",
    "fixtures/fleet-v2-breaking",
    "fixtures/fleet-v2-migration",
]

[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
